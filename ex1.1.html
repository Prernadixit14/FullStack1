<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration</title>

    <!-- INTERNAL CSS -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            width: 350px;
            margin: 50px auto;
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 5px;
        }

        input:invalid {
            border: 2px solid red;
        }

        .error {
            color: red;
            font-size: 12px;
            margin-bottom: 10px;
        }

        button {
            padding: 8px 15px;
            background-color: black;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Student Registration</h2>

    <form>
        <label>Full Name:</label>
        <input type="text"
               required
               pattern="[A-Za-z ]{9,50}">
        <div class="error">Must contain 9–50 letters</div>

        <label>Email:</label>
        <input type="email" required>
        <div class="error">Valid email required</div>

        <label>Age:</label>
        <input type="number" min="16" max="30" required>
        <div class="error">Age 16–30 only</div>

        <button type="submit">Register</button>
    </form>
</div>

</body>
</html>
