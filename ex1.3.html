<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-color: #1e293b;
            --text-color: white;
        }

        body {
            margin: 0;
            font-family: Arial;
            background: var(--bg-color);
            color: var(--text-color);
        }

        .dashboard {
            display: grid;
            grid-template-columns: 200px 1fr;
            height: 100vh;
        }

        .sidebar {
            background: #020617;
            padding: 20px;
        }

        .content {
            padding: 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: var(--card-color);
            padding: 30px;
            text-align: center;
            border-radius: 10px;
        }

        button {
            padding: 10px;
            cursor: pointer;
        }

        .light {
            --bg-color: #f8fafc;
            --card-color: #e2e8f0;
            --text-color: black;
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <div class="sidebar">
            <h2>Navigation</h2>
        </div>

        <div class="content">
            <h1>Admin Dashboard</h1>
            <button onclick="toggleTheme()">Light Mode</button>

            <div class="cards">
                <div class="card">Analytics</div>
                <div class="card">Users</div>
                <div class="card">Settings</div>
            </div>
        </div>

    </div>

    <script>
        function toggleTheme() {
            document.body.classList.toggle("light");
        }
    </script>

</body>
</html>
